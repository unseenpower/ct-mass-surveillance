<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
     width="1200" height="630" role="img"
     aria-label="Police departments ran 12,895,873 searches of Connecticut cameras between 2023-01 and 2026-08">
  <rect width="1200" height="630" fill="#F8F9F9"/>
  <rect x="0" y="0" width="10" height="630" fill="#3f51b5"/>

  <text x="72" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600"
        letter-spacing="2.5" fill="#6E7C7D">CT MASS SURVEILLANCE — ALPR AUDIT</text>

  <text x="72" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700"
        fill="#141A1C">Police departments ran</text>
  <text x="72" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="700"
        fill="#3f51b5">12,895,873</text>
  <text x="72" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600"
        fill="#141A1C">searches of Connecticut cameras</text>

  <line x1="72" y1="378" x2="1128" y2="378" stroke="#CBD3D2" stroke-width="2"/>
  
  <text x="72" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40"
        font-weight="700" fill="#3f51b5">5,647</text>
  <text x="72" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#3D4A4D">separate agencies</text>
  <text x="72" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#6E7C7D">ran them</text>
  <text x="428" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40"
        font-weight="700" fill="#3f51b5">4,730</text>
  <text x="428" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#3D4A4D">camera networks reached</text>
  <text x="428" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#6E7C7D">by the average search</text>
  <text x="784" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40"
        font-weight="700" fill="#3f51b5">2023-01 – 2026-08</text>
  <text x="784" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#3D4A4D">period covered</text>
  <text x="784" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#6E7C7D">from six towns' exports</text>

  <text x="72" y="574" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#6E7C7D">
    Counted from six Connecticut towns&#8217; own Flock audit exports — so the real total is higher.
  </text>
</svg>
